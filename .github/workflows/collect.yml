# The hourly collector (docs/phase2-plan.md). GitHub runs scheduled workflows from the default branch only, so this
# runs once it is merged to main. Refresh on the site starts it with workflow_dispatch.
#
# Between runs the engine's files live in the Actions cache (.cloud-cache): the sealed database copy, the raw
# snapshots for the 72 hour windows and the datasets. Each run saves a new cache entry and restores the newest by
# prefix; GitHub evicts the oldest entries past its cache size limit. The durable copy is the sealed database on the
# release named "data" (src/cloud/layout.ts). Everything stored is encrypted with DATA_KEY.
name: collect
on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
# The cycle calls only releases, contents and git refs (src/cloud/githubStore.ts); the Actions cache has its own token.
permissions:
  contents: write   # the data release and the data-inbox branch
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore the engine files
        uses: actions/cache/restore@v4
        with:
          path: .cloud-cache
          key: wowf-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wowf-data-
      - name: One cycle
        run: npm run cloud:run
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_DEV_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
          CLOUD_CACHE_DIR: .cloud-cache
          # The hourly run waits up to 15 minutes for Blizzard's publish; a Refresh from the site does not wait.
          WAIT_FOR_PUBLISH_MIN: ${{ github.event_name == 'workflow_dispatch' && '0' || '15' }}
      # Only after a good cycle: a failed one leaves the last good cache in place.
      - name: Save the engine files
        uses: actions/cache/save@v4
        with:
          path: .cloud-cache
          key: wowf-data-${{ github.run_id }}-${{ github.run_attempt }}
